services:
  - type: web
    name: inventory-management-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ocr/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Fuzzy-only matching skips torch/sentence-transformers — required for free tier.
      - key: FUZZY_ONLY_MATCHING
        value: "true"
      # Set these in the Render dashboard (Environment tab):
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
